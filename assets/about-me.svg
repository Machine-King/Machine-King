<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="739"
     viewBox="0 0 1000 739" font-size="26"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Carlos Rodríguez — Terminal Profile</title>
  <desc id="dsc">Flat CRT monitor card with a Python-style profile for Carlos Rodríguez.</desc>
  <style>
    text {
      font-family: "Cascadia Code", "Cascadia Mono", "JetBrains Mono",
                   "Fira Code", "SFMono-Regular", Consolas, Menlo,
                   "DejaVu Sans Mono", monospace;
    }
    .t  { fill: #f2f2f2; }
    .p  { fill: #2fe9ff; }
    .k  { fill: #2fe9ff; }
    .s  { fill: #f2f2f2; }
    .n  { fill: #f2f2f2; }
    .d  { fill: #707070; }
    .v  { fill: #ffffff; font-weight: 600; }
    .out{ fill: #ff5fd9; font-weight: 600; }
    .cur{ fill: #2fe9ff; }
    .mtitle { font-size: 14px; letter-spacing: .2px; }
    .mt-contact { fill: #2fe9ff; }
    .mt-user { fill: #2fe9ff; }
    .mt-path { fill: #9a9a9a; }
    </style>
  
    <defs>
      <clipPath id="mScreenClip">
        <rect x="16" y="16" width="968" height="679" rx="8"/>
      </clipPath>
      <pattern id="mScanlines" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
      </pattern>
    </defs>
    

  <!-- monitor shell: black border, white bezel -->
  <rect x="1" y="1" width="998" height="737" rx="19"
        fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="16" y="16" width="968" height="679"
        rx="8" fill="#000000"/>

  <g clip-path="url(#mScreenClip)">
    <text x="60" y="43" class="mtitle" xml:space="preserve"><tspan class="mt-contact">carlosl.rodriguez2003@gmail.com</tspan></text>
    <line x1="16" y1="58" x2="984" y2="58"
          stroke="#ff5fd9" stroke-width="1" opacity=".55"/>

    <text x="60" y="104.0" xml:space="preserve" textLength="215.67" lengthAdjust="spacingAndGlyphs"><tspan class="p">&gt;&gt;&gt; </tspan><tspan class="v">profile</tspan><tspan class="d"> = {</tspan></text><text x="60" y="143.0" xml:space="preserve" textLength="503.23" lengthAdjust="spacingAndGlyphs"><tspan class="p">... </tspan><tspan class="t">    </tspan><tspan class="k">"name"</tspan><tspan class="d">: </tspan><tspan class="s">"Carlos Rodríguez"</tspan><tspan class="d">,</tspan></text><text x="60" y="182.0" xml:space="preserve" textLength="690.14" lengthAdjust="spacingAndGlyphs"><tspan class="p">... </tspan><tspan class="t">    </tspan><tspan class="k">"role"</tspan><tspan class="d">: </tspan><tspan class="s">"Data Scientist &amp; AI Developer"</tspan><tspan class="d">,</tspan></text><text x="60" y="221.0" xml:space="preserve" textLength="402.58" lengthAdjust="spacingAndGlyphs"><tspan class="p">... </tspan><tspan class="t">    </tspan><tspan class="k">"location"</tspan><tspan class="d">: </tspan><tspan class="s">"Spain"</tspan><tspan class="d">,</tspan></text><text x="60" y="260.0" xml:space="preserve" textLength="833.92" lengthAdjust="spacingAndGlyphs"><tspan class="p">... </tspan><tspan class="t">    </tspan><tspan class="k">"interests"</tspan><tspan class="d">: [</tspan><tspan class="s">"Generative AI"</tspan><tspan class="d">, </tspan><tspan class="s">"Machine Learning"</tspan><tspan class="d">,</tspan></text><text x="60" y="299.0" xml:space="preserve" textLength="762.03" lengthAdjust="spacingAndGlyphs"><tspan class="p">...</tspan><tspan class="t">                   </tspan><tspan class="s">"Data Analysis"</tspan><tspan class="d">, </tspan><tspan class="s">"Statistics"</tspan><tspan class="d">]</tspan><tspan class="d">,</tspan></text><text x="60" y="338.0" xml:space="preserve" textLength="733.28" lengthAdjust="spacingAndGlyphs"><tspan class="p">... </tspan><tspan class="t">    </tspan><tspan class="k">"tools"</tspan><tspan class="d">: [</tspan><tspan class="s">"Python"</tspan><tspan class="d">, </tspan><tspan class="s">"PyTorch"</tspan><tspan class="d">, </tspan><tspan class="s">"LangChain"</tspan><tspan class="d">,</tspan></text><text x="60" y="377.0" xml:space="preserve" textLength="718.90" lengthAdjust="spacingAndGlyphs"><tspan class="p">...</tspan><tspan class="t">               </tspan><tspan class="s">"Scikit-learn"</tspan><tspan class="d">, </tspan><tspan class="s">"SQL"</tspan><tspan class="d">, </tspan><tspan class="s">"Pandas"</tspan><tspan class="d">,</tspan></text><text x="60" y="416.0" xml:space="preserve" textLength="589.50" lengthAdjust="spacingAndGlyphs"><tspan class="p">...</tspan><tspan class="t">               </tspan><tspan class="s">"NumPy"</tspan><tspan class="d">, </tspan><tspan class="s">"Matplotlib"</tspan><tspan class="d">]</tspan><tspan class="d">,</tspan></text><text x="60" y="455.0" xml:space="preserve" textLength="877.06" lengthAdjust="spacingAndGlyphs"><tspan class="p">... </tspan><tspan class="t">    </tspan><tspan class="k">"goal"</tspan><tspan class="d">: </tspan><tspan class="s">"Transforming data into actionable insights"</tspan><tspan class="d">,</tspan></text><text x="60" y="494.0" xml:space="preserve" textLength="71.89" lengthAdjust="spacingAndGlyphs"><tspan class="p">... </tspan><tspan class="d">}</tspan></text><text x="60" y="572.0" xml:space="preserve" textLength="273.18" lengthAdjust="spacingAndGlyphs"><tspan class="p">&gt;&gt;&gt; </tspan><tspan class="v">profile</tspan><tspan class="d">[</tspan><tspan class="k">"goal"</tspan><tspan class="d">]</tspan></text><text x="60" y="611.0" xml:space="preserve" textLength="632.63" lengthAdjust="spacingAndGlyphs"><tspan class="out">'Transforming data into actionable insights'</tspan></text><text x="60" y="650.0" xml:space="preserve" textLength="71.89" lengthAdjust="spacingAndGlyphs"><tspan class="p">&gt;&gt;&gt; </tspan><tspan class="cur">█<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan></text>

    <rect x="16" y="16" width="968" height="679"
          fill="url(#mScanlines)" opacity=".6"/>
  </g>

  <!-- monitor LED -->
  <circle cx="970" cy="717.0" r="5.2" fill="#000000"/>
  <circle cx="970" cy="717.0" r="3.2" fill="#2fe9ff"/>
</svg>
